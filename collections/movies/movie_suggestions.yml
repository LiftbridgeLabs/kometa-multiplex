##############################################################
##               Suggestions Collections                    ##
##############################################################

#######################
##     Templates     ##
#######################

templates:
  Suggestion:
    url_poster: https://theposterdb.com/api/assets/<<poster>>
    collection_mode: hide
    collection_order: release.desc
    # visible_home: range(01/01-12/31)
    # visible_shared: range(01/01-12/31)
    sync_mode: sync

collections:

#################
##    SIMKL    ##
#################
# Trakt lists replaced 2026-09-19 (Trakt support removed in Kometa 2.4.9).
# simkl_trending needs no simkl: config block or account — Kometa
# fetches it through its own Simkl service. The old couchmoney.tv
# "Recommended" list was Trakt-only and has no equivalent, so it was dropped.

  Trending:
    template: {name: Suggestion, poster: 532898}
    simkl_trending:
      period: today
      limit: 50
    summary: "Movies trending on SIMKL today"
    sort_title: +++_Trending

  Popular:
    template: {name: Suggestion, poster: 532900}
    simkl_trending:
      period: week
      limit: 50
    summary: "The most watched movies on SIMKL over the past week."
    sort_title: ++++_Popular

  Newly Released:
    template: {name: Suggestion, poster: 532904}
    url_poster: https://theposterdb.com/api/assets/213599
    # simkl_dvd would fit better, but Kometa 2.4.8 treats any item with a
    # TVDb id as a show and SIMKL tags most movies with one, so it keeps only
    # ~3 of 100 DVD releases. Swap back to `simkl_dvd: 50` once that's fixed.
    tmdb_now_playing: 50
    summary: "A collection of movies currently playing in theaters."
    sort_title: +++++_Newly Released

  Watchlist:
    template: {name: Suggestion, poster: 241611}
    url_poster: https://theposterdb.com/api/assets/532905
    mdblist_list: https://mdblist.com/lists/bsm-venger/my-watchlist
    collection_order: release.desc
    sync_mode: sync
    summary: "A collection of movies I want to watch."
    sort_title: +_Watchlist
