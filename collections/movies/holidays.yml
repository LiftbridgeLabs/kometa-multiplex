##############################################################
##                  Holiday Collections                     ##
##############################################################

#######################
##     Templates     ##
#######################

templates:
    Holiday:
        sort_title: +++++++++++_<<collection_name>>
        url_poster: <<poster>>
        smart_label: title.asc
        collection_mode: hide
        delete_not_scheduled: false
        run_again: true
        visible_home: true
        visible_shared: true
        sync_mode: sync

#############################
##       Collections       ##
#############################

# Sources mirror Kometa's own seasonal defaults (defaults/movie/seasonal.yml)
# since Trakt support is removed in Kometa 2.4.9 (2026-09). Groundhog Day has
# no upstream equivalent, so it uses the IMDb "time-loop" keyword. Extra
# holiday keywords (new-years-eve, easter, halloween) fill gaps the Trakt
# lists used to cover. Mother's Day skips upstream's "motherhood, pregnancy"
# keywords (288 matches, far too broad) for a small MDBList list instead.
# Christmas and Mother's Day use MDBList, which needs the mdblist: block in
# config.yml.

# FYI: To set the collections on a schedule to where they don't show all year long uncomment "schedule" and and change "delete_not_scheduled:" to "true"

collections:
  New Year's Eve Movies:
    template: {name: Holiday, holiday: "New Year's Eve", poster: https://theposterdb.com/api/assets/408570}
    visible_home: range(12/26-01/05)
    visible_shared: range(12/26-01/05)
    #schedule: range(12/26-01/05)
    smart_label: critic_rating.desc
    collection_mode: hide
    imdb_list:
      - https://www.imdb.com/list/ls066838460/
    imdb_search:
      type: movie
      keyword.any: new-years-eve
      limit: 0
    summary: This collection revolves around the plot involving New Year's Eve.
  Groundhog Day Movies:
    template: {name: Holiday, holiday: "Groundhog Day", poster: https://theposterdb.com/api/assets/15392}
    visible_home: range(01/28-02/02)
    visible_shared: range(01/28-02/02)
    #schedule: range(01/28-02/02)
    smart_label: critic_rating.desc
    collection_mode: hide
    imdb_search:
