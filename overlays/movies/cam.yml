templates:
  warning:
    plex_all: true
    filters:
      filepath.regex: '(?i)<<pattern>>'
    overlay:
      name: <<overlay_name>>
      file: /config/overlays/images/cam.png
      group: warning
      weight: <<weight>>
    allowed_library_types: movie

# Pattern notes: matched only inside the [{Quality Full}] bracket that
# Radarr writes, never loose in the path. The naming format is
#   {Movie CleanTitle} ({Release Year}) {tmdb-{TmdbId}}{edition-{Edition Tags}}
#   [{Quality Full}][{MediaInfo AudioCodec} {MediaInfo AudioChannels}]{-Release Group}
# so the source is always bracket-wrapped and drawn from Radarr's fixed
# quality vocabulary -- these match that vocabulary exactly rather than
# guessing at scene-style names.
#
# Anchoring is what keeps a *title* from being read as a source: "Body Cam
# (2020) [Bluray-1080p]" and "Nanny Cam (2014) [WEBDL-1080p]" are
# legitimate rips that a loose CAM match flags wrongly.
#
# The trailing [^\]]* absorbs a revision suffix -- Radarr writes
# "[Bluray-1080p Proper]" (198 files here), so "[CAM Proper]" is possible
# and must still match.
overlays:
  CAM:
    variables:
      pattern: '\[CAM[^\]]*\]'
      weight: 4
    template: [name: warning]
  TELESYNC:
    variables:
      pattern: '\[(?:TELESYNC|TELECINE)[^\]]*\]'
      weight: 3
    template: [name: warning]

  # Mislabeled uploads. A theatrical release from the last 180 days carrying
  # AC3 *stereo* is a tell: a genuine WEB-DL of a current release ships 5.1
  # or better, so AC3 2.0 points at a camcorder/dubbed source no matter what
  # the filename claims.
  #
  # Verified 2026-08-30 against unlimited-primary (5487 movies): 107 have
  # AC3 2.0, but only 8 are recent releases -- and all 8 are the same
  # upload group, four of them claiming [WEBDL-1080p]/[WEBRip-1080p].
  # The other 99 are older films where stereo is normal, which is why the
  # release window is not optional.
  #
  # audio_codec is what keeps this safe: 31 recent releases have <=2
  # channels, but the aac/eac3 ones are legitimately-stereo documentaries
  # and concert films. Narrowing to ac3 leaves only the fakes.
  #
  # Weight 2 sits below TELESYNC (3) and CAM (4) in the same `warning`
  # group, so an honest [CAM]/[TELESYNC] filename still shows its own
  # banner and nothing double-stacks -- this only adds the ones that lie.
  SUSPECT_AUDIO:
    plex_all: true
    filters:
      release: 180
      audio_codec: ac3
      channels.lte: 2
    overlay:
      name: SUSPECT_AUDIO
      file: /config/overlays/images/cam.png
      group: warning
      weight: 2
    allowed_library_types: movie

  # Same idea, different tell -- for fakes that use AAC instead of AC3 and so
  # slip past SUSPECT_AUDIO. A real WEB-DL is an .mkv (5282 of the 5487 in
  # this library); an .mp4 carrying stereo audio for a release still in
  # theatres is a repackaged cam.
  #
  # Both halves are load-bearing, verified 2026-08-30 against
  # unlimited-primary. Of 14 recent .mp4 releases, 8 ship 5.1 and come from
  # real encoders (BHDStudio, TheMrG, QHstudIo) -- container alone would
  # flag those wrongly. The other 6 are stereo and all look repackaged.
  # Equally, stereo alone over-reaches: recent stereo .mkv releases are
  # mostly legitimate documentaries and concert films.
  SUSPECT_CONTAINER:
    plex_all: true
    filters:
      release: 180
      channels.lte: 2
      filepath.regex: '(?i)\.mp4$'
    overlay:
      name: SUSPECT_CONTAINER
      file: /config/overlays/images/cam.png
      group: warning
      weight: 1
    allowed_library_types: movie
