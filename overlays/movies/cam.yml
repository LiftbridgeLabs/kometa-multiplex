templates:
  warning:
    plex_all: true
    filters:
      filepath.regex: '(?i)<<pattern>>'
    overlay:
      name: <<overlay_name>>
      file: /config/overlays/images/cam.png
      group: warning
      weight: <<weight>>
    allowed_library_types: movie

# Pattern notes: matched only inside the [{Quality Full}] bracket that
# Radarr writes, never loose in the path. The naming format is
#   {Movie CleanTitle} ({Release Year}) {tmdb-{TmdbId}}{edition-{Edition Tags}}
#   [{Quality Full}][{MediaInfo AudioCodec} {MediaInfo AudioChannels}]{-Release Group}
# so the source is always bracket-wrapped and drawn from Radarr's fixed
# quality vocabulary -- these match that vocabulary exactly rather than
# guessing at scene-style names.
#
# Anchoring is what keeps a *title* from being read as a source: "Body Cam
# (2020) [Bluray-1080p]" and "Nanny Cam (2014) [WEBDL-1080p]" are
# legitimate rips that a loose CAM match flags wrongly.
#
# The trailing [^\]]* absorbs a revision suffix -- Radarr writes
# "[Bluray-1080p Proper]" (198 files here), so "[CAM Proper]" is possible
# and must still match.
# MANUAL OVERRIDE: add the Plex label "Not CAM" to any item to exempt it from
# the four inferred rules below (UNRELEASED / SUSPECT_AUDIO / SUSPECT_CODEC /
# SUSPECT_CONTAINER). Those rules read audio layout, container and dates, so
# they cannot tell a genuinely stereo release from a re-encode -- "Cockroaches
# (2026) [WEBDL-1080p][AAC 2.0]-FLIX" is a real film that simply ships stereo.
# Labelling is the supported way to correct one: removing the banner by hand in
# Plex does not survive the next run, because Kometa reapplies overlays each
# time. The label is deliberately NOT honoured by CAM / TELESYNC / SCREENER --
# those read an explicit Radarr quality tag, which is a statement of fact
# rather than a guess.
overlays:
  CAM:
    variables:
      pattern: '\[CAM[^\]]*\]'
      weight: 7
    template: [name: warning]
  TELESYNC:
    variables:
      pattern: '\[(?:TELESYNC|TELECINE)[^\]]*\]'
      weight: 6
    template: [name: warning]

  # The rest of Radarr's pre-retail tier. Quality names confirmed against
  # this Radarr instance's own /api/v3/qualitydefinition, worst first:
  #   WORKPRINT(2) CAM(3) TELESYNC(4) TELECINE(5) REGIONAL(6) DVDSCR(7)
  # None are present in the library today, so this changes nothing now --
  # it is here to catch a bad grab on arrival rather than after someone
  # sits down to watch it.
  #
  # REGIONAL is the loose one: it is an early *retail* disc, not a recorded
  # screen, and Radarr ranks it above TELECINE. Drop it from this pattern
  # if a legitimate regional release ever gets bannered.
  SCREENER:
    variables:
      pattern: '\[(?:WORKPRINT|DVDSCR|REGIONAL)[^\]]*\]'
      weight: 5
    template: [name: warning]

  # Mislabeled uploads. A theatrical release from the last 180 days carrying
  # AC3 *stereo* is a tell: a genuine WEB-DL of a current release ships 5.1
  # or better, so AC3 2.0 points at a camcorder/dubbed source no matter what
  # the filename claims.
  #
  # Verified 2026-08-30 against unlimited-primary (5487 movies): 107 have
  # AC3 2.0, but only 8 are recent releases -- and all 8 are the same
  # upload group, four of them claiming [WEBDL-1080p]/[WEBRip-1080p].
  # The other 99 are older films where stereo is normal, which is why the
  # release window is not optional.
  #
  # audio_codec is what keeps this safe: 31 recent releases have <=2
  # channels, but the aac/eac3 ones are legitimately-stereo documentaries
  # and concert films. Narrowing to ac3 leaves only the fakes.
  #
  # Weight 2 sits below TELESYNC (3) and CAM (4) in the same `warning`
  # group, so an honest [CAM]/[TELESYNC] filename still shows its own
  # banner and nothing double-stacks -- this only adds the ones that lie.
  SUSPECT_AUDIO:
    plex_all: true
    filters:
      label.not: 'Not CAM'
      release: 180
      audio_codec: ac3
      channels.lte: 2
    overlay:
      name: SUSPECT_AUDIO
      file: /config/overlays/images/cam.png
      group: warning
      weight: 3
    allowed_library_types: movie

  # Same idea, different tell -- for fakes that use AAC instead of AC3 and so
  # slip past SUSPECT_AUDIO. A real WEB-DL is an .mkv (5282 of the 5487 in
  # this library); an .mp4 carrying stereo audio for a release still in
  # theatres is a repackaged cam.
  #
  # Both halves are load-bearing, verified 2026-08-30 against
  # unlimited-primary. Of 14 recent .mp4 releases, 8 ship 5.1 and come from
  # real encoders (BHDStudio, TheMrG, QHstudIo) -- container alone would
  # flag those wrongly. The other 6 are stereo and all look repackaged.
  # Equally, stereo alone over-reaches: recent stereo .mkv releases are
  # mostly legitimate documentaries and concert films.
  SUSPECT_CONTAINER:
    plex_all: true
    filters:
      label.not: 'Not CAM'
      release: 180
      channels.lte: 2
      filepath.regex: '(?i)\.mp4$'
    overlay:
      name: SUSPECT_CONTAINER
      file: /config/overlays/images/cam.png
      group: warning
      weight: 1
    allowed_library_types: movie

  # Not out yet. A film whose release date has not arrived cannot have a
  # genuine WEB-DL, whatever the filename says -- this is the one rule here
  # that cannot produce a false positive. Exactly 3 titles in the library
  # match today (The Weight 09-16, The Mongoose 10-29, Zip Wire 11-04) and
  # all 3 are AAC 2.0, which is what first drew attention to them.
  #
  # Deliberately has no codec or container condition: the point is that the
  # date alone settles it.
  UNRELEASED:
    plex_all: true
    filters:
      label.not: 'Not CAM'
      release.after: today
    overlay:
      name: UNRELEASED
      file: /config/overlays/images/cam.png
      group: warning
      weight: 4
    allowed_library_types: movie

  # AAC stereo on a current release. Netflix, Amazon and Disney+ all ship
  # EAC3, so AAC 2.0 on a 2026 WEB-DL is a re-encode signature rather than a
  # real service rip. This is what catches the mkv fakes that SUSPECT_AUDIO
  # (ac3-only) and SUSPECT_CONTAINER (mp4-only) both miss -- "Everyone Is
  # Lying to You for Money", a Documentary released 2026-04-17, is caught by
  # this rule and by no other.
  #
  # -playWEB is exempted by explicit choice: it is an established web-release
  # group and its titles here are Netflix documentaries (Untold: Chess Mates,
  # Untold UK: Vinnie Jones, Jamie Vardy, Kill Code). Codec alone cannot tell
  # those apart from the fakes, so the group carries the distinction. Remove
  # the filepath.not line to widen this back to every AAC 2.0 release.
  #
  # Note the eac3 stereo titles are intentionally untouched: André Is an
  # Idiot, Euphoria: A Look Back, S4: The Bob Lazar Story, The Python Hunt
  # and friends are legitimately-stereo documentaries.
  SUSPECT_CODEC:
    plex_all: true
    filters:
      label.not: 'Not CAM'
      release: 180
      audio_codec: aac
      channels.lte: 2
      filepath.not: '-playWEB'
    overlay:
      name: SUSPECT_CODEC
      file: /config/overlays/images/cam.png
      group: warning
      weight: 2
    allowed_library_types: movie
